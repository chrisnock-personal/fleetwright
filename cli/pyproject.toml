[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetwright-cli"
version = "0.1.0"
description = "fw: FleetWright from the command line, through its API, with your token's role"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=24"]

[project.scripts]
fw = "fleetwright_cli.main:main"

[tool.setuptools]
packages = ["fleetwright_cli"]
